[project]
name = "centraldepo-parser"
version = "0.1.0"
description = "A Mistral Workflows project"
requires-python = "==3.14.3"
dependencies = [
    "mistralai-workflows>=3.0.0,<4",
    "pydantic",
    "python-dotenv",
    "aiohttp>=3.8",
    # Document conversion dependencies
    "python-docx",
    "xlrd",
    "docx2txt",
    "mistralai-workflows-plugins-mistralai",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8.0",
    "watchdog>=4.0",
]
