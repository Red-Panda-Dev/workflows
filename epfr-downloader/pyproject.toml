[project]
name = "epfr-downloader"
version = "0.1.0"
description = "Mistral Workflow to download dividend disclosure files from epfr.gov.by"
requires-python = ">=3.14,<3.15"
dependencies = [
    "mistralai-workflows==3.1.1",
    "mistralai-workflows-plugins-mistralai==3.1.1",
    "mistralai==2.4.0",
    "pydantic==2.13.2",
    "python-dotenv==1.2.2",
    "aiohttp==3.14.3",
    "python-docx>=1.1.2",
    "docx2txt>=0.8",
    "xlrd>=2.0.1",
    "openpyxl>=3.1.0",
    "olefile>=0.47",
    "pytest-mock>=3.14.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.11",
    "pytest==9.0.3",
    "pytest-mock==3.14.0",
    "coverage>=7.6",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "D", "B", "UP", "C4", "SIM", "PIE", "T20"]
ignore = ["E501", "E712"]

[tool.ruff.lint.isort]
known-first-party = ["workflows"]
lines-after-imports = 2
lines-between-types = 1
combine-as-imports = true
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D100"]
"src/workflows/start.py" = ["E402"]
"src/discover.py" = ["E402"]
"src/migrations/**" = ["E101", "W", "E"]
"src/tests/**" = ["D101", "D102", "D103", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"
